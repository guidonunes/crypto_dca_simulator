version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: dca_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: crypto_simulator
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./dca-simulator-backend
    container_name: dca_backend_container
    depends_on:
      - mysql_db
    ports:
      - "8080:8080"
    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql_db:3306/crypto_simulator?allowPublicKeyRetrieval=true&useSSL=false
    env_file:
      - .env

volumes:
  mysql_data: